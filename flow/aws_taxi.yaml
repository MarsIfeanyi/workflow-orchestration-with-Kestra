id: 08_aws_taxi
namespace: zoomcamp
description: |
  The CSV Data used in the course: https://github.com/DataTalksClub/nyc-tlc-data/releases

inputs:
  - id: taxi
    type: SELECT
    displayName: Select taxi type
    values: [yellow, green]
    defaults: green

  - id: year
    type: SELECT
    displayName: Select year
    values: ["2019", "2020"]
    defaults: "2019"
    allowCustomValue: true

  - id: month
    type: SELECT
    displayName: Select month
    values: ["01", "02", "03", "04", "05", "06", "07", "08", "09", "10", "11", "12"]
    defaults: "01"

variables:
  file: "{{inputs.taxi}}_tripdata_{{inputs.year}}-{{inputs.month}}.csv"
  s3_file: "s3://{{kv('AWS_BUCKET_NAME')}}/{{vars.file}}"
  table: "{{kv('AWS_DATASET')}}.{{inputs.taxi}}_tripdata_{{inputs.year}}_{{inputs.month}}"
  data: "{{outputs.extract.outputFiles[inputs.taxi ~ '_tripdata_' ~ inputs.year ~ '-' ~ inputs.month ~ '.csv']}}"

tasks:
  - id: set_label
    type: io.kestra.plugin.core.execution.Labels
    labels:
      file: "{{render(vars.file)}}"
      taxi: "{{inputs.taxi}}"

  - id: extract
    type: io.kestra.plugin.scripts.shell.Commands
    outputFiles:
      - "*.csv"
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    commands:
      - curl -sL https://github.com/DataTalksClub/nyc-tlc-data/releases/download/{{inputs.taxi}}/{{render(vars.file)}}.gz | gunzip > {{render(vars.file)}}



  - id: upload_to_s3
    type: io.kestra.plugin.aws.s3.Upload
    from: "{{render(vars.data)}}"
    key: "{{inputs.taxi}}_tripdata/{{render(vars.file)}}"
    bucket: "{{kv('AWS_BUCKET_NAME')}}"  

  - id: if_yellow_taxi
    type: io.kestra.plugin.core.flow.If
    condition: "{{inputs.taxi == 'yellow'}}"
    then:
      - id: athena_yellow_tripdata
        type: io.kestra.plugin.aws.athena.Query
        database: "{{kv('AWS_DATASET')}}"
        outputLocation: "s3://{{kv('AWS_BUCKET_NAME')}}/athena-results/"
        query: |
          CREATE EXTERNAL TABLE IF NOT EXISTS yellow_tripdata (
              unique_row_id STRING,
              filename STRING,
              VendorID STRING,
              tpep_pickup_datetime STRING,
              tpep_dropoff_datetime STRING,
              passenger_count INT,
              trip_distance DOUBLE,
              RatecodeID STRING,
              store_and_fwd_flag STRING,
              PULocationID STRING,
              DOLocationID STRING,
              payment_type INT,
              fare_amount DOUBLE,
              extra DOUBLE,
              mta_tax DOUBLE,
              tip_amount DOUBLE,
              tolls_amount DOUBLE,
              improvement_surcharge DOUBLE,
              total_amount DOUBLE,
              congestion_surcharge DOUBLE
          )
          ROW FORMAT SERDE 'org.apache.hadoop.hive.serde2.OpenCSVSerde'
          WITH SERDEPROPERTIES (
            'skip.header.line.count'='1',
            'use.null.for.invalid.data'='true')
          STORED AS TEXTFILE
          LOCATION 's3://{{kv('AWS_BUCKET_NAME')}}/yellow_tripdata/'

      - id: athena_yellow_table_ext
        type: io.kestra.plugin.aws.athena.Query
        database: "{{kv('AWS_DATASET')}}"
        outputLocation: "s3://{{kv('AWS_BUCKET_NAME')}}/athena-results/"
        query: |
          CREATE EXTERNAL TABLE IF NOT EXISTS yellow_tripdata_{{inputs.year}}_{{inputs.month}}_ext (
              VendorID STRING,
              tpep_pickup_datetime STRING,
              tpep_dropoff_datetime STRING,
              passenger_count INT,
              trip_distance DOUBLE,
              RatecodeID STRING,
              store_and_fwd_flag STRING,
              PULocationID STRING,
              DOLocationID STRING,
              payment_type INT,
              fare_amount DOUBLE,
              extra DOUBLE,
              mta_tax DOUBLE,
              tip_amount DOUBLE,
              tolls_amount DOUBLE,
              improvement_surcharge DOUBLE,
              total_amount DOUBLE,
              congestion_surcharge DOUBLE
          )
          ROW FORMAT SERDE 'org.apache.hadoop.hive.serde2.OpenCSVSerde'
          WITH SERDEPROPERTIES (
            'skip.header.line.count'='1',
            'use.null.for.invalid.data'='true')
          STORED AS TEXTFILE
          LOCATION 's3://{{kv('AWS_BUCKET_NAME')}}/{{inputs.taxi}}_tripdata_{{inputs.year}}-{{inputs.month}}/'
          TBLPROPERTIES ('skip.header.line.count'='1')

      - id: athena_yellow_table_tmp
        type: io.kestra.plugin.aws.athena.Query
        database: "{{kv('AWS_DATASET')}}"
        outputLocation: "s3://{{kv('AWS_BUCKET_NAME')}}/athena-results/"
        query: |
          CREATE TABLE IF NOT EXISTS yellow_tripdata_{{inputs.year}}_{{inputs.month}}
          AS
          SELECT
            to_hex(md5(to_utf8(concat(
              coalesce(VendorID, ''),
              coalesce(tpep_pickup_datetime, ''),
              coalesce(tpep_dropoff_datetime, ''),
              coalesce(PULocationID, ''),
              coalesce(DOLocationID, '')
            )))) AS unique_row_id,
            '{{render(vars.file)}}' AS filename,
            *
          FROM yellow_tripdata_{{inputs.year}}_{{inputs.month}}_ext

      - id: athena_yellow_merge
        type: io.kestra.plugin.aws.athena.Query
        database: "{{kv('AWS_DATASET')}}"
        outputLocation: "s3://{{kv('AWS_BUCKET_NAME')}}/athena-results/"
        query: |
          INSERT INTO yellow_tripdata
          SELECT s.*
          FROM yellow_tripdata_{{inputs.year}}_{{inputs.month}} s
          LEFT JOIN yellow_tripdata t ON t.unique_row_id = s.unique_row_id
          WHERE t.unique_row_id IS NULL

  - id: if_green_taxi
    type: io.kestra.plugin.core.flow.If
    condition: "{{inputs.taxi == 'green'}}"
    then:
      - id: athena_green_tripdata
        type: io.kestra.plugin.aws.athena.Query
        database: "{{kv('AWS_DATASET')}}"
        outputLocation: "s3://{{kv('AWS_BUCKET_NAME')}}/athena-results/"
        query: |
          CREATE EXTERNAL TABLE IF NOT EXISTS green_tripdata (
              unique_row_id STRING,
              filename STRING,
              VendorID STRING,
              lpep_pickup_datetime STRING,
              lpep_dropoff_datetime STRING,
              store_and_fwd_flag STRING,
              RatecodeID STRING,
              PULocationID STRING,
              DOLocationID STRING,
              passenger_count INT,
              trip_distance DOUBLE,
              fare_amount DOUBLE,
              extra DOUBLE,
              mta_tax DOUBLE,
              tip_amount DOUBLE,
              tolls_amount DOUBLE,
              ehail_fee DOUBLE,
              improvement_surcharge DOUBLE,
              total_amount DOUBLE,
              payment_type INT,
              trip_type STRING,
              congestion_surcharge DOUBLE
          )
          ROW FORMAT SERDE 'org.apache.hadoop.hive.serde2.OpenCSVSerde'
          WITH SERDEPROPERTIES ('skip.header.line.count'='1')
          STORED AS TEXTFILE
          LOCATION 's3://{{kv('AWS_BUCKET_NAME')}}/green_tripdata/'
          
          
      - id: athena_green_table_ext
        type: io.kestra.plugin.aws.athena.Query
        database: "{{kv('AWS_DATASET')}}"
        outputLocation: "s3://{{kv('AWS_BUCKET_NAME')}}/athena-results/"
        query: |
          CREATE EXTERNAL TABLE IF NOT EXISTS green_tripdata_{{inputs.year}}_{{inputs.month}}_ext (
              VendorID STRING,
              lpep_pickup_datetime STRING,
              lpep_dropoff_datetime STRING,
              store_and_fwd_flag STRING,
              RatecodeID STRING,
              PULocationID STRING,
              DOLocationID STRING,
              passenger_count INT,
              trip_distance DOUBLE,
              fare_amount DOUBLE,
              extra DOUBLE,
              mta_tax DOUBLE,
              tip_amount DOUBLE,
              tolls_amount DOUBLE,
              ehail_fee DOUBLE,
              improvement_surcharge DOUBLE,
              total_amount DOUBLE,
              payment_type INT,
              trip_type STRING,
              congestion_surcharge DOUBLE
          )
          ROW FORMAT SERDE 'org.apache.hadoop.hive.serde2.OpenCSVSerde'
          WITH SERDEPROPERTIES ('skip.header.line.count'='1')
          STORED AS TEXTFILE
          LOCATION 's3://{{kv('AWS_BUCKET_NAME')}}/{{inputs.taxi}}_tripdata_{{inputs.year}}-{{inputs.month}}/'
          TBLPROPERTIES ('skip.header.line.count'='1')

      - id: athena_green_table_tmp
        type: io.kestra.plugin.aws.athena.Query
        database: "{{kv('AWS_DATASET')}}"
        outputLocation: "s3://{{kv('AWS_BUCKET_NAME')}}/athena-results/"
        query: |
          CREATE TABLE IF NOT EXISTS green_tripdata_{{inputs.year}}_{{inputs.month}}
          AS
          SELECT
            to_hex(md5(to_utf8(concat(
              coalesce(VendorID, ''),
              coalesce(lpep_pickup_datetime, ''),
              coalesce(lpep_dropoff_datetime, ''),
              coalesce(PULocationID, ''),
              coalesce(DOLocationID, '')
            )))) AS unique_row_id,
            '{{render(vars.file)}}' AS filename,
            *
          FROM green_tripdata_{{inputs.year}}_{{inputs.month}}_ext

      - id: athena_green_merge
        type: io.kestra.plugin.aws.athena.Query
        database: "{{kv('AWS_DATASET')}}"
        outputLocation: "s3://{{kv('AWS_BUCKET_NAME')}}/athena-results/"
        query: |
          INSERT INTO green_tripdata
          SELECT s.*
          FROM green_tripdata_{{inputs.year}}_{{inputs.month}} s
          LEFT JOIN green_tripdata t ON t.unique_row_id = s.unique_row_id
          WHERE t.unique_row_id IS NULL

  - id: purge_files
    type: io.kestra.plugin.core.storage.PurgeCurrentExecutionFiles
    description: If you'd like to explore Kestra outputs, disable it.
    disabled: false

pluginDefaults:
  - type: io.kestra.plugin.aws
    values:
      accessKeyId: "{{kv('AWS_ACCESS_KEY_ID')}}"
      secretKeyId: "{{kv('AWS_SECRET_ACCESS_KEY')}}"
      region: "{{kv('AWS_REGION')}}"